name: Security Scans

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan Python source with Semgrep
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src" \
            --workdir /src \
            semgrep/semgrep@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1 \
            semgrep scan --config p/python --sarif --output semgrep.sarif --error .

      - name: Upload Semgrep SARIF report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Start API with scan-only credentials
        run: |
          nohup python uid2-api.py > app.log 2>&1 < /dev/null &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          cat app.log
          exit 1
        env:
          UID2_API_KEY: UID2-C-P-SECURITY-SCAN
          UID2_CLIENT_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          API_BEARER_TOKEN: security-workflow-test-token

      - name: Verify token endpoint requires authentication
        run: |
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --request POST http://127.0.0.1:8000/uid2/token \
            --header "Content-Type: application/json" \
            --data '{"identifiers":[{"id_type":"email","id_value":"test@example.com"}]}')
          test "$status" = "401"

      - name: Run OWASP ZAP baseline scan
        run: |
          mkdir -p zap-output
          chmod 777 zap-output
          docker run --rm --network host \
            --volume "$PWD/zap-output:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-baseline.py -t http://127.0.0.1:8000 -m 2 -I -r zap-report.html

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-baseline-report
          path: zap-output/zap-report.html
          if-no-files-found: warn
